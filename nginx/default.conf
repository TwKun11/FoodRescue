map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 ipv6=off valid=30s;

# =========================
# HTTP → HTTPS redirect
# =========================
server {
    listen 80;
    server_name foodrescue.store;

    return 301 https://$host$request_uri;
}

# =========================
# HTTPS SERVER
# =========================
server {
    listen 443 ssl;
    server_name foodrescue.store;

    ssl_certificate /etc/letsencrypt/live/foodrescue.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodrescue.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================
    # FRONTEND (Next.js)
    # =========================
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR / future usage)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================
    # BACKEND API
    # =========================
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================
    # HEALTH CHECK
    # =========================
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}