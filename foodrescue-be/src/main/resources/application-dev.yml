spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/foodrescue?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:11111111}
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}

app:
  seed:
    reset-demo-accounts: ${RESET_DEMO_ACCOUNTS:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
